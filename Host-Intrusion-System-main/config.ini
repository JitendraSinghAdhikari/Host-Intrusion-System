[MONITORING]
filesystem = true
processes = true
periodic_scans = true
registry = true
process_check_interval = 2
registry_check_interval = 5
scan_interval = 10
anomaly_detection = true

[PATHS]
watch_paths = test_area
quarantine_dir = test_quarantine
baseline_file = hids_baseline.json

[FILTERS]
whitelisted_paths = C:\Windows\Temp;AppData\Local\Temp
whitelisted_processes = svchost.exe,explorer.exe
scan_extensions = .apk,.exe,.dll,.ps1,.vbs,.js,.bat,.cmd

[RESPONSE]
quarantine = true
kill_process = false

[INDICATORS]
known_malicious_hashes = 31d6cfe0d16ae931b73c59d7e0c089c0,b7e72f20851ee4f7fdbdf5ada23471f8
suspicious_markers = powershell,FromBase64String,Invoke-Expression,IEX,mshta,certutil,bitsadmin,regsvr32,rundll32,VirtualAlloc,WriteProcessMemory,CreateRemoteThread,URLDownloadToFile

[ANOMALY]
learning_duration = 3600
late_night_hours = 23,0,1,2,3,4,5
suspicious_registry_keys = HKLM\Software\Microsoft\Windows\CurrentVersion\Run,HKCU\Software\Microsoft\Windows\CurrentVersion\Run

[GUI]
start_minimized = false
refresh_interval = 1000
theme = dark
